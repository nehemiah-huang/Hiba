<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#1a1a1a">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    margin: 0;
    overflow-x: hidden;
    width: 100%;
  }
  
  .iow-wrap {
    /* Background image implementation */
    background-image: url('mobile-bg-600w.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #1a1a1a;
    background-attachment: scroll;
    position: relative;
    isolation: isolate;
    width: 100%;
    min-height: 100vh;
    padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 3vw, 2rem);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow-x: hidden;
  }
  
  /* Overlay for text readability */
  .iow-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(26, 26, 26, 0.85);
    z-index: 1;
    backdrop-filter: blur(2px);
  }
  
  /* Desktop background */
  @media (min-width: 768px) {
    .iow-wrap {
      background-image: url('desktop-bg-1920w.jpg');
    }
    
    @supports (background-attachment: fixed) {
      .iow-wrap {
        background-attachment: fixed;
      }
    }
  }
  
  /* Content above overlay */
  .iow-wrap > * {
    position: relative;
    z-index: 2;
  }
  
  .fonts-loaded .iow-wrap {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  .iow-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  
  .iow-header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 500;
    color: #E6E6E6;
    margin-bottom: 0.75rem;
    line-height: 1.3;
  }
  
  .iow-header p {
    color: #D1D1D1;
    font-size: clamp(1rem, 3vw, 1.1rem);
    max-width: min(600px, 90%);
    margin: 0 auto;
  }
  
  .inbox-card {
    background: #2c2c2c;
    border-radius: 16px;
    border: 1px solid rgba(230, 230, 230, 0.12);
    width: 100%;
    max-width: 1400px; /* Much wider - was 820px */
    margin: 0 auto;
    overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  
  /* Even wider on large screens */
  @media (min-width: 1600px) {
    .inbox-card {
      max-width: 1600px;
    }
  }
  
  .inbox-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid rgba(230, 230, 230, 0.08);
    flex-wrap: wrap;
    gap: 1rem;
  }
  
  .inbox-top span {
    font-size: 1.1rem;
    font-weight: 500;
    color: #E6E6E6;
    font-family: 'Playfair Display', Georgia, serif;
  }
  
  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(230, 230, 230, 0.15);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    min-width: 240px;
    max-width: 300px;
  }
  
  .search-bar svg {
    flex-shrink: 0;
    opacity: 0.6;
  }
  
  .search-bar input {
    background: transparent;
    border: none;
    outline: none;
    color: #D1D1D1;
    font-size: 0.9rem;
    width: 100%;
    font-family: inherit;
  }
  
  .search-bar input::placeholder {
    color: rgba(209, 209, 209, 0.5);
  }
  
  .inbox-row {
    display: flex;
    align-items: flex-start;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid rgba(230, 230, 230, 0.06);
    gap: 1.25rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  
  .inbox-row:last-child {
    border-bottom: none;
  }
  
  .inbox-row:hover {
    background: rgba(187, 153, 64, 0.08);
  }
  
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: #3a3a3a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
    color: #bb9940;
  }
  
  .row-content {
    flex: 1;
    min-width: 0;
  }
  
  .row-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
  }
  
  .row-name {
    font-size: 1rem;
    font-weight: 600;
    color: #E6E6E6;
  }
  
  .row-tag {
    font-size: 0.75rem;
    color: #b0b39a;
    background: rgba(187, 153, 64, 0.12);
    padding: 0.2rem 0.6rem;
    border-radius: 12px;
    font-weight: 400;
  }
  
  .row-message {
    font-size: 1rem;
    color: #D1D1D1;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  
  .unread-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #bb9940;
    flex-shrink: 0;
    margin-top: 0.5rem;
  }
  
  .msg-text {
    flex: 1;
    font-size: 1rem;
  }
  
  .row-arrow {
    color: rgba(230, 230, 230, 0.4);
    font-size: 1.5rem;
    line-height: 1;
    flex-shrink: 0;
    margin-left: auto;
    align-self: center;
    transition: transform 0.2s, color 0.2s;
  }
  
  .inbox-row:hover .row-arrow {
    color: #bb9940;
    transform: translateX(4px);
  }
  
  /* Desktop optimizations */
  @media (min-width: 1024px) {
    .iow-wrap {
      padding: 3rem 3rem;
    }
    
    .inbox-top {
      padding: 1.5rem 2.5rem;
    }
    
    .inbox-row {
      padding: 1.5rem 2.5rem;
    }
    
    .avatar {
      width: 52px;
      height: 52px;
      font-size: 18px;
    }
    
    .row-name {
      font-size: 1.05rem;
    }
    
    .row-message {
      font-size: 1.05rem;
    }
    
    .msg-text {
      font-size: 1.05rem;
    }
  }
  
  /* Mobile - Message First Design */
  @media (max-width: 600px) {
    .iow-wrap {
      padding: 2rem 1rem;
    }
    
    .inbox-card {
      border-radius: 12px;
    }
    
    .inbox-top {
      padding: 1rem 1.25rem;
    }
    
    .search-bar {
      min-width: 140px;
      max-width: 100%;
      padding: 0.5rem 0.8rem;
    }
    
    .inbox-row {
      padding: 1.25rem 1.25rem;
      gap: 1rem;
    }
    
    .avatar {
      width: 44px;
      height: 44px;
      font-size: 15px;
    }
    
    .row-header {
      margin-bottom: 0.5rem;
    }
    
    .row-name {
      font-size: 1rem;
    }
    
    .row-message {
      font-size: 1rem;
      line-height: 1.5;
    }
    
    .msg-text {
      font-weight: 400;
      font-size: 1rem;
    }
    
    .unread-dot {
      width: 10px;
      height: 10px;
      margin-top: 0.4rem;
    }
    
    .row-arrow {
      font-size: 1.4rem;
      opacity: 0.5;
    }
  }
  
  /* Small mobile */
  @media (max-width: 400px) {
    .iow-wrap {
      padding: 1.5rem 0.75rem;
    }
    
    .inbox-row {
      padding: 1rem;
    }
    
    .avatar {
      width: 40px;
      height: 40px;
      font-size: 14px;
    }
  }
  
  /* No results message */
  .no-results {
    padding: 3rem;
    text-align: center;
    color: #B3B3B3;
    font-size: 1rem;
  }
  
  /* Reduced motion preference */
  @media (prefers-reduced-motion: reduce) {
    .inbox-row,
    .row-arrow {
      transition: none;
    }
  }
</style>
  </style>
</head>
<body>
  <div class="iow-wrap">
    <div class="iow-header">
      <h1>A quick look inside my inbox of wins</h1>
      <p>What I tend to hear once I've helped bring structure, clarity, and calm to the work.</p>
    </div>

    <div class="inbox-card">
      <div class="inbox-top">
        <span>Inbox of wins</span>
        <div class="search-bar">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="5" stroke="#E6E6E6" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="#E6E6E6" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="text" placeholder="Search feedback..." id="searchInput" aria-label="Search feedback">
        </div>
      </div>

      <div id="rowsList">
        <!-- Row items remain the same as original -->
        <div class="inbox-row" data-search="kwabena systems overhaul launch ran smoother">
          <div class="avatar">KA</div>
          <div class="row-meta"><span class="row-name">Kwabena</span><span class="row-tag">Systems overhaul</span></div>
          <div class="row-msg"><span class="msg-text">Thanks again, the whole launch ran so much smoother.</span></div>
          <div class="row-right"><span class="row-time">1 day ago</span><span class="row-arrow">›</span></div>
        </div>
        <!-- Add all other rows here... -->
      </div>
    </div>
  </div>

  <script>
    // Improved search with no-results message
    function filterRows(val) {
      const q = val.toLowerCase();
      const rowsList = document.getElementById('rowsList');
      const rows = document.querySelectorAll('#rowsList .inbox-row');
      let visibleCount = 0;
      
      // Remove existing no-results message
      const existingMsg = rowsList.querySelector('.no-results');
      if (existingMsg) existingMsg.remove();
      
      rows.forEach(row => {
        const matches = row.dataset.search.includes(q);
        row.style.display = matches ? 'flex' : 'none';
        row.setAttribute('aria-hidden', !matches);
        if (matches) visibleCount++;
      });
      
      // Show no results message if needed
      if (visibleCount === 0 && q.length > 0) {
        const noResults = document.createElement('div');
        noResults.className = 'no-results';
        noResults.textContent = 'No matching feedback found';
        rowsList.appendChild(noResults);
      }
    }
    
    // Initialize search
    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function() {
        filterRows(this.value);
      });
      
      // Mark fonts as loaded
      document.fonts.ready.then(function() {
        document.documentElement.classList.add('fonts-loaded');
      });
    });
  </script>
</body>
</html>
